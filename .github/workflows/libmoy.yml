name: libmoy

# Build the C core and run this repository's conformance suite against it.
#
# libmoy lives here rather than in its own repository precisely so this job can
# exist: a change to the spec, the goldens or the scenes turns the C
# implementation red on the same push, with no pin to bump and no second
# checkout. It is the reason the directory is in-tree.
#
# Cheap enough to run on everything -- no toolchain to install, no cache to
# warm. `cc` and Python are all it needs, which is also the claim libmoy makes
# about itself.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  conform:
    name: build + conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -Werror only in CI: a warning that reaches main is a warning nobody
      # will fix, but a contributor mid-change should not be blocked by one.
      - name: Build
        run: make CFLAGS="-std=c99 -O2 -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wstrict-prototypes -Werror -Iinclude"
        working-directory: libmoy

      # The embedded palette and font are generated from palette.json and
      # font.bin. Regenerating must be a no-op -- if it is not, someone edited
      # the generated file by hand or the spec's data moved without the C
      # following, and either way the two have silently forked.
      - name: The embedded data still matches the spec
        run: |
          make data
          git diff --exit-code src/moy_data.c
        working-directory: libmoy

      - name: Conformance (recorded traces -- the raster)
        run: make conform
        working-directory: libmoy

      # The same suite through a real .moy cart, parsed and run as Lua. Checks
      # the binding and the sandbox, which a trace cannot reach: a raster bug
      # fails both, a binding bug only this one.
      - name: Conformance (real carts -- the console)
        run: make conform-lua
        working-directory: libmoy

      - name: The desktop port still builds
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev
          make play
        working-directory: libmoy

      - name: The SPEC.md 4.1 sandbox holds
        run: |
          mkdir -p /tmp/sbx.moy
          echo '{"format":"moy-1","title":"s","main":"main.lua"}' > /tmp/sbx.moy/manifest.json
          for reach in "io.open('/etc/passwd')" "os.time()" "require('os')" \
                       "load('return 1')" "debug.getinfo(1)" "coroutine.create(print)" \
                       "collectgarbage()" "package.path"; do
            printf 'function _draw() cls(1) local x = %s end\n' "$reach" > /tmp/sbx.moy/main.lua
            if ./build/run_cart /tmp/sbx.moy /tmp/sbx.bin 2>/dev/null; then
              echo "SANDBOX BREACH: $reach was allowed"; exit 1
            fi
          done
          echo "all eight reaches refused"
        working-directory: libmoy

  # A Windows player, because most game developers are on Windows and "download
  # a zip, drag your cart onto the exe" is the difference between trying moy and
  # not. Cross-compiled with mingw -- the same ~250-line SDL2 port the Makefile
  # builds on Linux, nothing Windows-specific in the source. The zip is the
  # whole install: moy-play.exe + SDL2.dll + a README.
  windows-player:
    name: moy-play.exe (mingw)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cross-compile
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
          curl -sL -o sdl.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.30.11/SDL2-devel-2.30.11-mingw.tar.gz
          tar xf sdl.tar.gz
          SDL=$PWD/SDL2-2.30.11/x86_64-w64-mingw32
          mkdir -p dist-win
          x86_64-w64-mingw32-gcc -std=c99 -O2 -DMOY_WITH_LUA -Iinclude -Ivendor/lua \
            -I$SDL/include -I$SDL/include/SDL2 \
            port/sdl2/main.c src/moy_canvas.c src/moy_sprite.c src/moy_data.c src/moy_lua.c \
            vendor/lua/*.c \
            -L$SDL/lib -lmingw32 -lSDL2main -lSDL2 -lm \
            -o dist-win/moy-play.exe
          cp $SDL/bin/SDL2.dll dist-win/
          printf 'moy-play -- the moy console as a Windows program.\r\n\r\nRun a cart:  drag a .moy folder onto moy-play.exe,\r\nor from a terminal:  moy-play.exe path\\to\\game.moy\r\n\r\nArrows = d-pad, Z/X = A/B, Enter = run, Esc = quit.\r\nSpec and tools: https://github.com/moybyte-org/moy-spec\r\n' > dist-win/README.txt
        working-directory: libmoy

      # Linking is not running (the lesson this repo keeps re-learning). Wine
      # executes the actual artifact against a self-quitting cart that touches
      # the provisional verbs; rc=0 or the job is red. The env pins are test-rig
      # honesty, not product configuration: the dummy drivers make it headless,
      # the DLL overrides suppress Wine's first-run dialog (which reads as a
      # silent hang), and SDL_RENDER_VSYNC=0 sidesteps simulated vsync against
      # the dummy display, which stalls ~1s per frame and reads as 1 fps.
      - name: It runs, not just links (Wine)
        run: |
          sudo apt-get install -y -qq wine64
          mkdir -p smoke.moy
          printf '{"format":"moy-1","title":"smoke","main":"main.lua"}' > smoke.moy/manifest.json
          printf 'local n=0\nfunction _update(dt) n=n+1 if n>30 then quit() end end\nfunction _draw() cls(1) tri(100,20,160,30,130,80,8) tline(0,100,319,100,0,0,65536,0) end\n' > smoke.moy/main.lua
          cd dist-win
          WINEDLLOVERRIDES="mscoree,mshtml=d" WINEDEBUG=-all \
            SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy SDL_RENDER_VSYNC=0 \
            timeout 120 wine ./moy-play.exe ../smoke.moy
          echo "the Windows player ran a cart and exited cleanly"
        working-directory: libmoy

      - uses: actions/upload-artifact@v4
        with:
          name: moy-play-windows-x64
          path: libmoy/dist-win/

  # The ESP-IDF component, built for real silicon.
  #
  # Not a substitute for running it on a board -- nothing here proves a pixel
  # ever reaches a panel. What it does prove is everything that can be wrong
  # before you get that far: the component registers under the name the README
  # gives, its include paths resolve, both sides of CONFIG_MOY_WITH_LUA compile,
  # and the C is clean on two different 32-bit ABIs under the IDF's own
  # -Wall -Werror=all. Every one of those was a live guess until this job ran,
  # and three of them were wrong the first time.
  #
  # esp32p4 is the reference console's part; esp32s3 is here because it is
  # xtensa rather than RISC-V, and a library that claims to be portable C should
  # be made to prove it somewhere other than the chip it was written on.
  esp-idf:
    name: ESP-IDF component
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: esp32p4, lua: y}
          - {target: esp32p4, lua: n}   # the raster alone, no VM
          - {target: esp32s3, lua: y}   # xtensa
    steps:
      - uses: actions/checkout@v4

      - name: Build the example for ${{ matrix.target }} (Lua=${{ matrix.lua }})
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          echo "CONFIG_MOY_WITH_LUA=${{ matrix.lua }}" > /tmp/sdkconfig.defaults
          idf.py -B /tmp/build \
                 -DSDKCONFIG=/tmp/sdkconfig \
                 -DSDKCONFIG_DEFAULTS=/tmp/sdkconfig.defaults \
                 -DIDF_TARGET=${{ matrix.target }} \
                 build
        working-directory: libmoy/example/esp-idf

  # ... and then actually run it.
  #
  # Compiling proves the component registers and the C is portable; it proves
  # nothing about whether a line of it executes on an ESP32, and the four duties
  # a host owes libmoy are exactly the four a compiler cannot check. Espressif's
  # QEMU boots the example twice against one flash image and checks that the
  # cart runs, the frame keeps changing, and pmem survives the power cycle --
  # persistence that never reaches flash being indistinguishable from working
  # persistence right up until something reboots.
  #
  # esp32, not esp32p4: QEMU does not emulate the P4. Different chip, still the
  # difference between "it links" and "it runs".
  qemu:
    name: Runs on emulated esp32
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4

      - name: Boot it
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          libmoy/test/esp_qemu.sh
