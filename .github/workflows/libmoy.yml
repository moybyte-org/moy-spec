name: libmoy

# Build the C core and run this repository's conformance suite against it.
#
# libmoy lives here rather than in its own repository precisely so this job can
# exist: a change to the spec, the goldens or the scenes turns the C
# implementation red on the same push, with no pin to bump and no second
# checkout. It is the reason the directory is in-tree.
#
# Cheap enough to run on everything -- no toolchain to install, no cache to
# warm. `cc` and Python are all it needs, which is also the claim libmoy makes
# about itself.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  conform:
    name: build + conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -Werror only in CI: a warning that reaches main is a warning nobody
      # will fix, but a contributor mid-change should not be blocked by one.
      - name: Build
        run: make CFLAGS="-std=c99 -O2 -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wstrict-prototypes -Werror -Iinclude"
        working-directory: libmoy

      # The embedded palette and font are generated from palette.json and
      # font.bin. Regenerating must be a no-op -- if it is not, someone edited
      # the generated file by hand or the spec's data moved without the C
      # following, and either way the two have silently forked.
      - name: The embedded data still matches the spec
        run: |
          make data
          git diff --exit-code src/moy_data.c
        working-directory: libmoy

      - name: Conformance (recorded traces -- the raster)
        run: make conform
        working-directory: libmoy

      # The same goldens against the direct-colour build. SPEC.md 1.1 lets a
      # host keep RGB565 pixels instead of indices; that is only true while
      # both builds draw the same frames, and only this job can say so.
      - name: Conformance (the RGB565 build -- SPEC.md 1.1)
        run: make conform-565 CFLAGS="-std=c99 -O2 -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wstrict-prototypes -Werror -Iinclude"
        working-directory: libmoy

      # SPEC.md 8's semantics, numerically: 8.3 exempts audio from pixel
      # conformance, so this is the synth's whole gate.
      - name: Audio semantics
        run: make audio-test
        working-directory: libmoy

      # The same suite through a real .moy cart, parsed and run as Lua. Checks
      # the binding and the sandbox, which a trace cannot reach: a raster bug
      # fails both, a binding bug only this one.
      - name: Conformance (real carts -- the console)
        run: make conform-lua
        working-directory: libmoy

      - name: The desktop port still builds
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev
          make play
        working-directory: libmoy

      - name: The SPEC.md 4.1 sandbox holds
        run: |
          mkdir -p /tmp/sbx.moy
          echo '{"format":"moy-1","title":"s","main":"main.lua"}' > /tmp/sbx.moy/manifest.json
          for reach in "io.open('/etc/passwd')" "os.time()" "require('os')" \
                       "load('return 1')" "debug.getinfo(1)" "coroutine.create(print)" \
                       "collectgarbage()" "package.path"; do
            printf 'function _draw() cls(1) local x = %s end\n' "$reach" > /tmp/sbx.moy/main.lua
            if ./build/run_cart /tmp/sbx.moy /tmp/sbx.bin 2>/dev/null; then
              echo "SANDBOX BREACH: $reach was allowed"; exit 1
            fi
          done
          echo "all eight reaches refused"
        working-directory: libmoy

  # A Windows player, because most game developers are on Windows and "download
  # a zip, drag your cart onto the exe" is the difference between trying moy and
  # not. Cross-compiled with mingw -- the same ~250-line SDL2 port the Makefile
  # builds on Linux, nothing Windows-specific in the source. Ships inside
  # moy-windows-x64.zip, assembled with the CLI by the release job below.
  windows-player:
    name: moy-play.exe (mingw)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cross-compile
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
          curl -sL -o sdl.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.30.11/SDL2-devel-2.30.11-mingw.tar.gz
          tar xf sdl.tar.gz
          SDL=$PWD/SDL2-2.30.11/x86_64-w64-mingw32
          mkdir -p dist-win
          x86_64-w64-mingw32-gcc -std=c99 -O2 -DMOY_WITH_LUA -Iinclude -Ivendor/lua \
            -I$SDL/include -I$SDL/include/SDL2 \
            port/sdl2/main.c src/moy_canvas.c src/moy_sprite.c src/moy_data.c src/moy_audio.c src/moy_lua.c \
            vendor/lua/*.c \
            -L$SDL/lib -lmingw32 -lSDL2main -lSDL2 -lm \
            -o dist-win/moy-play.exe
          cp $SDL/bin/SDL2.dll dist-win/
          printf 'moy-play -- the moy console as a Windows program.\r\n\r\nRun a cart:  drag a .moy folder onto moy-play.exe,\r\nor from a terminal:  moy-play.exe path\\to\\game.moy\r\n\r\nArrows = d-pad, Z/X = A/B, Enter = run, Esc = quit.\r\nSpec and tools: https://github.com/moybyte-org/moy-spec\r\n' > dist-win/README.txt
        working-directory: libmoy

      # Linking is not running (the lesson this repo keeps re-learning). Wine
      # executes the actual artifact against test/smoke.moy, the committed
      # cart that calls every verb family; rc=0 or the job is red. The env
      # pins are test-rig honesty, not product configuration: the dummy
      # drivers make it headless, the DLL overrides suppress Wine's first-run
      # dialog (which reads as a silent hang), and SDL_RENDER_VSYNC=0
      # sidesteps simulated vsync against the dummy display, which stalls ~1s
      # per frame and reads as 1 fps.
      - name: It runs, not just links (Wine)
        run: |
          sudo apt-get install -y -qq wine64
          cd dist-win
          WINEDLLOVERRIDES="mscoree,mshtml=d" WINEDEBUG=-all \
            SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy SDL_RENDER_VSYNC=0 \
            timeout 120 wine ./moy-play.exe ../test/smoke.moy
          echo "the Windows player ran the all-verbs cart and exited cleanly"
        working-directory: libmoy

      - uses: actions/upload-artifact@v4
        with:
          name: moy-play-windows-x64
          path: libmoy/dist-win/

  # The CLI as one native executable per OS, so "download moy and you have the
  # toolchain" holds on machines with no Python. PyInstaller cannot
  # cross-compile, hence one runner per OS -- which also means every binary is
  # smoke-tested on the OS it ships for, not under emulation. The smoke is the
  # real command set end to end: scaffold, check, pack round-trip, asset
  # export, THE CONFORMANCE SUITE from inside the frozen binary (which proves
  # every bundled data file), and push -- both its honest failure on a
  # console-less runner and a real tier-0 push to a marker volume.
  # The Linux leg builds inside Debian 11 (glibc 2.31), NOT on the runner's
  # own Ubuntu: a PyInstaller binary demands the glibc it was built against,
  # so building on ubuntu-latest quietly ships a binary that refuses to start
  # on anything older -- found the hard way, on a 22.04 machine, from the
  # first published tar. Old builder, wide audience.
  moy-cli:
    name: moy CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, container: "python:3.12-bullseye"}
          - {os: windows-latest, container: ""}
          - {os: macos-latest, container: ""}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.container == ''
        with:
          python-version: "3.12"

      # pyserial is the one optional battery: the SOURCE stays stdlib-only
      # (serial probing degrades to "skipped" without it), but a frozen bundle
      # cannot pip-install later, so it ships included.
      - name: Build
        run: |
          pip install pyinstaller pyserial
          pyinstaller moy.spec

      # The native player for the non-Windows legs, so every OS bundle is CLI
      # + player (Windows gets its player from the mingw job). SDL 2.30.11 is
      # built from source and linked STATICALLY on both: SDL dlopens
      # X11/Wayland/ALSA/Pulse at runtime (Cocoa is a system framework), so
      # the binary stays self-contained -- on Linux, ldd shows nothing beyond
      # libc. On macOS there is no packaged alternative anyway: Homebrew's
      # sdl2 is now sdl2-compat, an SDL3 shim with no static library, which is
      # how the first macOS build of this step failed.
      - name: Build moy-play (static SDL2 from source)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: libmoy
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            apt-get update -qq
            apt-get install -y -qq libx11-dev libxext-dev libxrandr-dev libxi-dev \
              libxcursor-dev libxfixes-dev libxss-dev libgl1-mesa-dev \
              libasound2-dev libpulse-dev libwayland-dev wayland-protocols libxkbcommon-dev
          fi
          curl -sL -o sdl.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.30.11/SDL2-2.30.11.tar.gz
          tar xf sdl.tar.gz
          (cd SDL2-2.30.11 && ./configure --disable-shared --enable-static \
             --prefix=$PWD/prefix >/dev/null && make -j"$(getconf _NPROCESSORS_ONLN)" >/dev/null && make install >/dev/null)
          SDLC=SDL2-2.30.11/prefix/bin/sdl2-config
          cc -std=c99 -O2 -DMOY_WITH_LUA -Iinclude -Ivendor/lua \
            -ISDL2-2.30.11/prefix/include $($SDLC --cflags) \
            port/sdl2/main.c src/moy_canvas.c src/moy_sprite.c src/moy_data.c src/moy_audio.c src/moy_lua.c \
            vendor/lua/*.c $($SDLC --static-libs) \
            -o ../dist/moy-play

      # Same bar as the Windows player's Wine gate: the binary that ships must
      # RUN a cart and exit cleanly, not just link. test/smoke.moy calls every
      # verb family -- goldens judge correctness elsewhere; this proves the
      # packaged binary reaches every verb path on its own OS. Headless via
      # SDL's dummy drivers.
      - name: The player runs the all-verbs cart
        if: runner.os != 'Windows'
        shell: bash
        run: |
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy SDL_RENDER_VSYNC=0 \
            ./dist/moy-play libmoy/test/smoke.moy
          echo "the native player ran the all-verbs cart and exited cleanly"

      - name: Smoke every command
        shell: bash
        run: |
          M="$PWD/dist/moy"; [ -f "$M" ] || M="$PWD/dist/moy.exe"
          mkdir smoke && cd smoke
          "$M" new t
          "$M" check t.moy
          "$M" pack t.moy
          "$M" unpack t.moyc roundtrip.moy
          "$M" gfx t.moy
          "$M" map t.moy
          "$M" conform
          if "$M" push t.moy; then
            echo "push claims it found a console on a CI runner"; exit 1
          fi
          mkdir vol
          echo '{"moy_console":"0.1","name":"ci","cart_root":"carts"}' > vol/moy-console.json
          "$M" push t.moy --to vol
          test -f vol/carts/t.moy/main.lua
          if [ "$RUNNER_OS" = "Windows" ]; then
            # No moy-play.exe in dist here (the mingw job builds it): the
            # subcommand must fail with its where-to-get-it message, not a
            # traceback.
            if "$M" play t.moy; then echo "play found a player that is not there"; exit 1; fi
          else
            SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy SDL_RENDER_VSYNC=0 \
              "$M" play ../libmoy/test/smoke.moy
          fi
          echo "every command ran from the frozen binary"

      - uses: actions/upload-artifact@v4
        with:
          name: moy-cli-${{ matrix.os }}
          path: dist/

  # A rolling release, so the README can link a stable URL that needs no
  # GitHub login and never expires -- artifacts do both. One tag, refreshed on
  # every main push AFTER the tests above have passed: the Windows zip is the
  # Wine-run-tested player plus the natively smoke-tested CLI, the tars are
  # the CLI for the other two. The download is never newer than its last
  # passing run.
  release:
    name: rolling release (player-latest)
    needs: [windows-player, moy-cli]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: Assemble the bundles
        run: |
          mkdir win lin mac
          cp art/moy-play-windows-x64/moy-play.exe art/moy-play-windows-x64/SDL2.dll win/
          cp art/moy-cli-windows-latest/moy.exe win/
          printf 'moy -- the toy console, bundled for Windows.\r\n\r\nmoy-play.exe   the native player: drag a .moy cart folder onto it.\r\n               Arrows/WASD = d-pad, Z/X (or J/K) = A/B, Enter = run, Esc = quit.\r\nmoy.exe        the whole toolchain, no Python needed: `moy new mygame`,\r\n               `moy run mygame.moy` (browser, hot reload), check, pack,\r\n               gfx/map PNG+CSV round-trips, conform, push. Run `moy` with\r\n               no arguments for the full list.\r\n\r\nSpec and source: https://github.com/moybyte-org/moy-spec\r\n' > win/README.txt
          (cd win && zip -q ../moy-windows-x64.zip *)
          printf 'moy -- the toy console: the CLI and the native player.\n\n  ./moy-play mygame.moy     play a cart. Arrows/WASD = d-pad,\n                            Z/X (or J/K) = A/B, Enter = run, Esc = quit\n  ./moy new mygame          scaffold a cart\n  ./moy run mygame.moy      play in your browser, hot reload on save\n  ./moy                     the full command list\n\nmacOS note: the binaries are unsigned -- first run is right-click -> Open,\nor `xattr -d com.apple.quarantine moy moy-play`.\n\nSpec and source: https://github.com/moybyte-org/moy-spec\n' > README.txt
          install -m 755 art/moy-cli-ubuntu-latest/moy lin/moy && cp README.txt lin/
          install -m 755 art/moy-cli-ubuntu-latest/moy-play lin/moy-play
          install -m 755 art/moy-cli-macos-latest/moy mac/moy && cp README.txt mac/
          install -m 755 art/moy-cli-macos-latest/moy-play mac/moy-play
          tar -C lin -czf moy-linux-x64.tar.gz moy moy-play README.txt
          tar -C mac -czf moy-macos-arm64.tar.gz moy moy-play README.txt

      - name: Refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view player-latest >/dev/null 2>&1 || \
            gh release create player-latest --title "moy (rolling)" --notes "placeholder" --latest=false
          gh release edit player-latest --title "moy (rolling): the CLI + native player, three OSes" \
            --notes "The moy toolchain as native executables, rebuilt and smoke-tested by CI on every push to main. Each download holds moy (the whole CLI: scaffold, browser run with hot reload, check, pack, asset round-trips, the conformance suite, push-to-console) plus moy-play, the native player -- on Windows, drag a .moy cart folder onto it. macOS is Apple Silicon and unsigned (first run: right-click, Open)."
          gh release upload player-latest moy-windows-x64.zip moy-linux-x64.tar.gz moy-macos-arm64.tar.gz --clobber
          gh release delete-asset player-latest moy-play-windows-x64.zip --yes 2>/dev/null || true

  # The ESP-IDF component, built for real silicon.
  #
  # Not a substitute for running it on a board -- nothing here proves a pixel
  # ever reaches a panel. What it does prove is everything that can be wrong
  # before you get that far: the component registers under the name the README
  # gives, its include paths resolve, both sides of CONFIG_MOY_WITH_LUA compile,
  # and the C is clean on two different 32-bit ABIs under the IDF's own
  # -Wall -Werror=all. Every one of those was a live guess until this job ran,
  # and three of them were wrong the first time.
  #
  # esp32p4 is the reference console's part; esp32s3 is here because it is
  # xtensa rather than RISC-V, and a library that claims to be portable C should
  # be made to prove it somewhere other than the chip it was written on.
  esp-idf:
    name: ESP-IDF component
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: esp32p4, lua: y}
          - {target: esp32p4, lua: n}   # the raster alone, no VM
          - {target: esp32s3, lua: y}   # xtensa
    steps:
      - uses: actions/checkout@v4

      - name: Build the example for ${{ matrix.target }} (Lua=${{ matrix.lua }})
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          echo "CONFIG_MOY_WITH_LUA=${{ matrix.lua }}" > /tmp/sdkconfig.defaults
          idf.py -B /tmp/build \
                 -DSDKCONFIG=/tmp/sdkconfig \
                 -DSDKCONFIG_DEFAULTS=/tmp/sdkconfig.defaults \
                 -DIDF_TARGET=${{ matrix.target }} \
                 build
        working-directory: libmoy/example/esp-idf

  # ... and then actually run it.
  #
  # Compiling proves the component registers and the C is portable; it proves
  # nothing about whether a line of it executes on an ESP32, and the four duties
  # a host owes libmoy are exactly the four a compiler cannot check. Espressif's
  # QEMU boots the example twice against one flash image and checks that the
  # cart runs, the frame keeps changing, and pmem survives the power cycle --
  # persistence that never reaches flash being indistinguishable from working
  # persistence right up until something reboots.
  #
  # esp32, not esp32p4: QEMU does not emulate the P4. Different chip, still the
  # difference between "it links" and "it runs".
  qemu:
    name: Runs on emulated esp32
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4

      - name: Boot it
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          libmoy/test/esp_qemu.sh
