<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>moy</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #101014; color: #d8d8e0;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overscroll-behavior: none; touch-action: manipulation;
  }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px; }
  /* SAFE centring. A centred flex column splits its overflow BOTH ways, so the
     moment the content is taller than the viewport the first child sits above
     y=0 -- clipped, and unreachable even by scrolling. That is not theoretical:
     in the site's demo iframe (356x410 on a phone) the body came to 419px and
     the title rendered at y=-9. `safe` makes an overflowing column pack to the
     start instead, so the top is always reachable and only the bottom spills.
     Written as two declarations because a browser without `safe` drops the
     second and keeps plain `center`. */
  body { justify-content: safe center; }
  /* NO TEXT SELECTION. A long-press on a phone was selecting the title or the
     status line and raising the callout menu mid-game -- the pad and the start
     overlay had already opted out individually, which left exactly the elements
     nobody thought of. The off-screen keyboard input opts back IN: it is a real
     <input> and a textmode() cart types into it. */
  html, body { user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; }
  #kbin { user-select: text; -webkit-user-select: text; }
  #title { font-size: 13px; letter-spacing: .04em; color: #8a8a99; margin: 0; }
  /* The console's pixels are the point: never smooth them, and never let the
     browser's default image scaling turn a 320x240 canvas into a blur. */
  #screen { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; display: block; }
  #status { min-height: 1.4em; color: #8a8a99; }
  /* CLICK TO START. Not decoration: a browser will not start an AudioContext
     without a user gesture, so a page that boots straight into the cart has no
     moment at which sound can legally begin -- it just plays silently forever.
     This is the p8-web-player pattern, and it is here for that reason. */
  #start { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; cursor: pointer;
    background: rgba(16,16,20,.72); color: #d8d8e0; user-select: none; }
  #start .tri { width: 0; height: 0; border-left: 34px solid currentColor;
    border-top: 22px solid transparent; border-bottom: 22px solid transparent;
    margin-left: 8px; opacity: .9; }
  #start small { letter-spacing: .12em; color: #8a8a99; }
  #wrap { position: relative; display: inline-block; line-height: 0; }
  #status.bad { color: #ff6b6b; white-space: pre-wrap; max-width: 90vw; text-align: center; }
  /* Off-screen, focusable: the only way to summon a phone's soft keyboard for a
     textmode() cart. Its value is never read -- keydown feeds key(). */
  #kbin { position: fixed; left: -1000px; top: 0; opacity: 0; }
  /* CONTROLS. A JOYSTICK, not a d-pad: on a phone a thumb lands somewhere near
     the middle and slides, it does not hit 44px squares, and moybyte's page
     learned that the hard way. Sized in vw/vh so it scales with the screen
     instead of being tiny on a tablet. */
  /* Shown by a CLASS, hidden by a MEDIA QUERY -- never by an inline style.
     The last version toggled style.display directly, and setting it to "" (the
     obvious "unset") falls back to the stylesheet's `display: none`, so the pad
     never appeared on any device at all. A class cannot make that mistake, and
     a media query re-evaluates when the pointer changes (a tablet docked to a
     mouse, a window dragged to another screen) where a one-shot matchMedia
     read at boot would not. */
  #pad.on { display: flex; }
  #pad { display: none; width: min(96vw, 112vh); max-width: 100%;
    justify-content: space-between; align-items: center; gap: min(8px, 1vw);
    padding: 10px 4px; box-sizing: border-box; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    --bb: min(68px, 15vw); --joy: min(116px, 26vw); }
  #joy { flex: 0 0 auto; position: relative; width: var(--joy); height: var(--joy);
    border-radius: 50%; background: #22222c; border: 2px solid #33333f; }
  #th { position: absolute; top: 50%; left: 50%;
    width: calc(var(--joy) * .43); height: calc(var(--joy) * .43);
    margin: calc(var(--joy) * -.215) 0 0 calc(var(--joy) * -.215);
    border-radius: 50%; background: #5f6f9f; border: 2px solid #c2c3c7;
    pointer-events: none; }
  #pad .b { flex: 0 0 auto; width: var(--bb); height: var(--bb); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font: 700 min(24px, 5.5vw) ui-monospace, monospace; color: #d8d8e0;
    background: #22222c; border: 1px solid #33333f; }
  #pad .b:active { background: #34344a; }
  #mid { display: flex; align-items: center; gap: min(9px, 1.5vw); }
  /* HOLD to reset, not tap: a reset one thumb-brush away from the A button
     would lose a game to a mis-tap, and the burger sits right beside it. The
     fill is the feedback -- a hold with no progress shown reads as a dead
     button, so people let go before it fires. */
  #bh { position: relative; overflow: hidden; }
  #bh::after { content: ""; position: absolute; inset: 0; background: #5f6f9f;
    opacity: .55; transform: scaleY(0); transform-origin: bottom; }
  #bh.hold::after { transform: scaleY(1); transition: transform .7s linear; }
  /* Specificity, not order: `#pad .b { display: flex }` above is (1,1,0) and
     would beat a bare `#kb { display: none }` at (1,0,0) -- the button showed on
     every cart no matter what the class said. Two ids wins. (Checking the class
     is absent is NOT a test for this; only the computed style is.) */
  #pad #kb { display: none; }          /* only for carts that declare keyboard */
  #pad #kb.on { display: flex; }
  #mid .b { width: min(40px, 9vw); height: min(40px, 9vw); font-size: min(18px, 4vw); }
  #ab { flex: 0 0 auto; display: flex; align-items: center; gap: min(10px, 2vw); }
  /* Keys on a real keyboard, the pad on a touchscreen -- each is noise on the
     other. `hover: hover and pointer: fine` is the "has a mouse" test. */
  #keys { display: none; color: #6a6a78; font-size: 11px; letter-spacing: .04em;
    text-align: center; }
  @media (hover: hover) and (pointer: fine) {
    /* A mouse needs no joystick or face buttons -- the keys do that better.
       The MIDDLE cluster stays: reset is worth having on a desktop too, and
       there is no keyboard gesture for it the way the boards have one. */
    #pad.on #joy, #pad.on #ab { display: none; }
    #pad.on { justify-content: center; }
    #keys { display: block; }
  }
  /* The real focusable input, pinned 1x1 at the viewport ORIGIN rather than
     parked off-screen: an off-screen focused input makes iOS scroll the page to
     chase it. font-size 16px because anything smaller makes iOS zoom in on
     focus and never zoom back out. */
  #kbin { position: fixed; left: 0; top: 0; width: 1px; height: 1px;
    opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<h1 id="title">moy</h1>
<div id="wrap">
  <canvas id="screen" width="320" height="240"></canvas>
  <div id="start"><div class="tri"></div><small>CLICK TO PLAY</small></div>
</div>
<div id="status"></div>
<div id="keys">arrows / WASD &nbsp;·&nbsp; Z or J = A &nbsp;·&nbsp; X or K = B &nbsp;·&nbsp; Enter = start</div>
<input id="kbin" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">

<div id="pad">
  <div id="joy"><div id="th"></div></div>
  <div id="mid"><b class="b" id="kb" title="keyboard">&#9000;</b><b class="b" id="bh" title="hold to reset">&#9776;</b></div>
  <div id="ab"><b class="b" data-btn="B">B</b><b class="b" data-btn="A">A</b></div>
</div>

<script type="module" src="player.js"></script>
